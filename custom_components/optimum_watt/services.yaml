add_device:
  name: Gerät hinzufügen
  description: Fügt ein neues, per PV-Überschuss gesteuertes Gerät hinzu (wird ans Ende der Prioritätsliste angehängt).
  fields:
    entry_id:
      name: Optimum Watt
      description: Die Instanz, zu der das Gerät hinzugefügt werden soll.
      required: true
      selector:
        config_entry:
          integration: optimum_watt
    name:
      name: Name
      description: Anzeigename des Geräts.
      required: true
      example: Boiler Stufe 1
      selector:
        text:
    entity_id:
      name: Schalter
      description: Die switch-Entität, die geschaltet werden soll.
      required: true
      selector:
        entity:
          domain: switch
    power_w:
      name: Leistungsbedarf
      description: Leistung in Watt, die dieses Gerät benötigt bzw. als Einschaltschwelle gilt.
      required: true
      example: 500
      selector:
        number:
          min: 0
          max: 20000
          step: 10
          unit_of_measurement: W
          mode: box
    hysteresis_w:
      name: Hysterese
      description: Abstand zwischen Ein- und Ausschaltschwelle (Standard 0 W).
      required: false
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          unit_of_measurement: W
          mode: box
    on_delay_s:
      name: Einschaltverzögerung
      description: Sekunden, die der Überschuss anstehen muss (Standard 300).
      required: false
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: s
          mode: box
    off_delay_s:
      name: Ausschaltverzögerung
      description: Sekunden, die der Unterschuss anstehen muss (Standard 300).
      required: false
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: s
          mode: box
    threshold_basis:
      name: Schwellenbasis
      description: Worauf sich die Einschaltschwelle bezieht - surplus = Netzüberschuss (Standard), production = rohe PV-Produktion, surplus_pre_storage = Überschuss vor Speicherladung.
      required: false
      selector:
        select:
          options:
            - "surplus"
            - "production"
            - "surplus_pre_storage"
    min_soc_percent:
      name: Mindest-Speicher-Ladestand
      description: Gerät darf nur einschalten, wenn der Speicher mindestens so weit geladen ist (%). Gilt nicht, wenn bereits tatsächlich ins Netz eingespeist wird und das allein die Einschaltschwelle deckt. 0/leer = keine Einschränkung.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_runtime_s:
      name: Mindestlaufzeit pro Tag
      description: Sekunden, die das Gerät pro Tag mindestens laufen soll. Wird die Zeit sonst nicht erreicht, schaltet Optimum Watt das Gerät notfalls auch ohne Überschuss ein, rechtzeitig vor der Deadline. Zusammen mit min_runtime_deadline angeben.
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          unit_of_measurement: s
          mode: box
    min_runtime_deadline:
      name: Deadline Mindestlaufzeit
      description: Uhrzeit (HH:MM, lokale Zeit), bis zu der die Mindestlaufzeit erreicht sein muss, z. B. "19:00".
      required: false
      example: "19:00"
      selector:
        text:
    min_on_duration_s:
      name: Mindestlaufzeit pro Aktivierung
      description: Sekunden, die das Gerät nach jedem Einschalten mindestens durchläuft, auch wenn der Überschuss vorher wegfällt.
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          unit_of_measurement: s
          mode: box
    info_entities:
      name: Info-Sensoren
      description: Zusätzliche Entitäten, die nur zur Anzeige neben dem Gerät eingeblendet werden (z. B. Temperatur oder aktuelle Leistung). Keine Auswirkung auf die Regelung.
      required: false
      selector:
        entity:
          multiple: true
    schedules:
      name: Schaltzeiten
      description: 'Liste wiederkehrender Zeitfenster, die den Modus überschreiben. Je Eintrag: start/end als "HH:MM", days als Liste 0-6 (Montag = 0), action = auto/on/off/disabled. Beispiel: [{"start": "22:00", "end": "06:00", "days": [0,1,2,3,4], "action": "off"}]'
      required: false
      selector:
        object:

remove_device:
  name: Gerät entfernen
  description: Entfernt ein Gerät aus der Kaskadensteuerung.
  fields:
    entry_id:
      name: Optimum Watt
      description: Die betroffene Instanz.
      required: true
      selector:
        config_entry:
          integration: optimum_watt
    device_id:
      name: Geräte-ID
      description: Die ID des zu entfernenden Geräts (siehe Karte oder list_devices).
      required: true
      selector:
        text:

set_device_mode:
  name: Gerätemodus setzen
  description: Erzwingt Automatik, An oder Aus für ein einzelnes Gerät.
  fields:
    entry_id:
      name: Optimum Watt
      description: Die betroffene Instanz.
      required: true
      selector:
        config_entry:
          integration: optimum_watt
    device_id:
      name: Geräte-ID
      description: Die ID des betroffenen Geräts.
      required: true
      selector:
        text:
    mode:
      name: Modus
      description: auto = Kaskadensteuerung, on = dauerhaft an, off = dauerhaft aus, disabled = Regelung aus (Optimum Watt fasst den Schalter nicht an).
      required: true
      selector:
        select:
          options:
            - "auto"
            - "on"
            - "off"
            - "disabled"

set_auto_mode:
  name: Automatik umschalten
  description: Schaltet die gesamte Kaskadensteuerung einer Instanz ein oder aus.
  fields:
    entry_id:
      name: Optimum Watt
      description: Die betroffene Instanz.
      required: true
      selector:
        config_entry:
          integration: optimum_watt
    enabled:
      name: Aktiv
      description: true = Automatik an, false = Automatik aus.
      required: true
      selector:
        boolean:
