name: Release

# A release is cut on demand by pushing a version tag that matches the
# integration's manifest version, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
#
# The release title and notes come from the matching "## <tag> - ..."
# section in CHANGELOG.md. workflow_dispatch re-publishes the current
# manifest version - handy for fixing up notes of an already-tagged
# release after editing the changelog.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag and check manifest
        id: rel
        run: |
          manifest="v$(jq -r .version custom_components/optimum_watt/manifest.json)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::Tag $tag does not match manifest version $manifest"
              exit 1
            fi
          else
            tag="$manifest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG.md
        id: notes
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          title=$(grep -m1 -E "^## ${tag}( |\$)" CHANGELOG.md | sed 's/^## //')
          body=$(awk -v h="## ${tag}" '
            $0 == h || index($0, h " ") == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)
          {
            echo "title=${title:-Optimum Watt $tag}"
            echo "body<<__EOF__"
            if [ -n "$body" ]; then printf '%s\n' "$body"; else echo "Siehe Commit-Historie."; fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          target_commitish: ${{ github.sha }}
          make_latest: true
