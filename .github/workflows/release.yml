name: Auto Release

on:
  push:
    branches: [wattix]
    paths:
      - "custom_components/optimum_watt/**"
      - "hacs.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read manifest version
        id: version
        run: echo "version=$(jq -r .version custom_components/optimum_watt/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Optimum Watt v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
