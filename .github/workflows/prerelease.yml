name: Beta Prerelease

# Every push to the default branch publishes an incrementing beta
# pre-release  v<manifest-version>-beta.<N>  and immediately deletes the
# previous one, so:
#   * HACS (with "Show beta versions" on) sees a new version each push and
#     offers it as an update - a fixed tag never triggers that.
#   * only ever ONE beta is visible in the releases list, not a stack.
#
# The stable release is cut separately by pushing a plain version tag,
# e.g.  git tag v0.2.1 && git push origin v0.2.1  (see release.yml).

on:
  push:
    branches: [optimum-watt]
    paths:
      - "custom_components/**"
      - "hacs.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the next beta tag
        id: t
        run: |
          base="v$(jq -r .version custom_components/optimum_watt/manifest.json)"
          last=$(git tag -l "${base}-beta.*" | sed 's/.*-beta\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          {
            echo "base=$base"
            echo "tag=${base}-beta.${next}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag this commit
        run: |
          git tag "${{ steps.t.outputs.tag }}"
          git push origin "refs/tags/${{ steps.t.outputs.tag }}"

      - name: Publish the beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name: Optimum Watt ${{ steps.t.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true

      - name: Remove every other beta pre-release
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '\-beta' \
            | grep -vx "${{ steps.t.outputs.tag }}" \
            | while read -r old; do
                echo "deleting $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
